apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongo-tracking-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: { storage: 1Gi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo-tracking
spec:
  selector:
    matchLabels: { app: mongo-tracking }
  template:
    metadata:
      labels: { app: mongo-tracking }
    spec:
      containers:
        - name: mongo
          image: mongo:7
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom: { secretKeyRef: { name: mongo-secret, key: username } }
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: mongo-secret, key: password } }
          ports: [{ containerPort: 27017 }]
          volumeMounts: [{ name: data, mountPath: /data/db }]
      volumes: [{ name: data, persistentVolumeClaim: { claimName: mongo-tracking-data } }]
---
apiVersion: v1
kind: Service
metadata:
  name: mongo-tracking
spec:
  selector: { app: mongo-tracking }
  ports: [{ port: 27017, targetPort: 27017 }]
