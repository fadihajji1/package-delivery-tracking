apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-users-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-users
spec:
  selector:
    matchLabels: { app: postgres-users }
  template:
    metadata:
      labels: { app: postgres-users }
    spec:
      containers:
        - name: postgres
          image: postgres:16
          env:
            - name: POSTGRES_DB
              value: users_db
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: postgres-secret, key: username } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: postgres-secret, key: password } }
          ports: [{ containerPort: 5432 }]
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
      volumes: [{ name: data, persistentVolumeClaim: { claimName: postgres-users-data } }]
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-users
spec:
  selector: { app: postgres-users }
  ports: [{ port: 5432, targetPort: 5432 }]
---
