apiVersion: apps/v1
kind: Deployment
metadata:
  name: discovery-server
spec:
  selector: { matchLabels: { app: discovery-server } }
  template:
    metadata: { labels: { app: discovery-server } }
    spec:
      containers:
        - name: discovery-server
          image: package-delivery/discovery-server:latest
          imagePullPolicy: Never
          ports: [{ containerPort: 8761 }]
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8761 }
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata: { name: discovery-server }
spec:
  selector: { app: discovery-server }
  ports: [{ port: 8761, targetPort: 8761 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-server
spec:
  selector: { matchLabels: { app: config-server } }
  template:
    metadata: { labels: { app: config-server } }
    spec:
      containers:
        - name: config-server
          image: package-delivery/config-server:latest
          imagePullPolicy: Never
          ports: [{ containerPort: 8888 }]
          env:
            - name: MANAGEMENT_ZIPKIN_TRACING_ENDPOINT
              valueFrom: { configMapKeyRef: { name: service-config, key: zipkin-url } }
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8888 }
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata: { name: config-server }
spec:
  selector: { app: config-server }
  ports: [{ port: 8888, targetPort: 8888 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
spec:
  selector: { matchLabels: { app: api-gateway } }
  template:
    metadata: { labels: { app: api-gateway } }
    spec:
      containers:
        - name: api-gateway
          image: package-delivery/api-gateway:latest
          imagePullPolicy: Never
          ports: [{ containerPort: 8080 }]
          env:
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              valueFrom: { configMapKeyRef: { name: service-config, key: eureka-url } }
            - name: MANAGEMENT_ZIPKIN_TRACING_ENDPOINT
              valueFrom: { configMapKeyRef: { name: service-config, key: zipkin-url } }
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8080 }
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata: { name: api-gateway }
spec:
  type: NodePort
  selector: { app: api-gateway }
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
spec:
  selector: { matchLabels: { app: user-service } }
  template:
    metadata: { labels: { app: user-service } }
    spec:
      containers:
        - name: user-service
          image: package-delivery/user-service:latest
          imagePullPolicy: Never
          ports: [{ containerPort: 8081 }]
          env:
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              valueFrom: { configMapKeyRef: { name: service-config, key: eureka-url } }
            - name: SPRING_CONFIG_IMPORT
              valueFrom: { configMapKeyRef: { name: service-config, key: config-url } }
            - name: MANAGEMENT_ZIPKIN_TRACING_ENDPOINT
              valueFrom: { configMapKeyRef: { name: service-config, key: zipkin-url } }
            - name: SPRING_DATASOURCE_URL
              valueFrom: { configMapKeyRef: { name: service-config, key: users-db-url } }
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom: { secretKeyRef: { name: postgres-secret, key: username } }
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom: { secretKeyRef: { name: postgres-secret, key: password } }
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8081 }
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata: { name: user-service }
spec:
  selector: { app: user-service }
  ports: [{ port: 8081, targetPort: 8081 }]
---
